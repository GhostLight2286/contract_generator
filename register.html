<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>body { font-family: Arial; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; } .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; } input, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; } button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }</style>
</head>
<body>
    <div class="box">
        <h2>Регистрация</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Придумайте логин" required>
            <input type="password" name="password" placeholder="Придумайте пароль" required>
            <select name="role">
                <option value="client">Я Клиент (создаю договоры)</option>
                <option value="notary">Я Нотариус (проверяю договоры)</option>
            </select>
            <button type="submit">Создать аккаунт</button>
        </form>
        <p style="text-align:center; margin-top:15px;"><a href="{{ url_for('login') }}">Уже есть аккаунт? Войти</a></p>
    </div>
</body>
</html>
